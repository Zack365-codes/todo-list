<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, responsive, accessible vanilla HTML, CSS, and JavaScript To-Do List application.">
  <title>TaskFlow &bull; Modern To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-background">
    <div class="glow-orb orb-1" aria-hidden="true"></div>
    <div class="glow-orb orb-2" aria-hidden="true"></div>
  </div>

  <main class="app-container">
    <div class="card todo-card" role="region" aria-label="To-Do List Application">
      <!-- App Header -->
      <header class="app-header">
        <div class="header-titles">
          <div class="logo-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 11 3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <div>
            <h1 class="app-title">TaskFlow</h1>
            <p class="app-subtitle" id="current-date">Stay organized and productive</p>
          </div>
        </div>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </header>

      <!-- Task Input Form -->
      <form id="todo-form" class="todo-form" novalidate>
        <div class="input-group">
          <div class="input-wrapper">
            <input
              type="text"
              id="todo-input"
              class="todo-input"
              placeholder="What needs to be done?"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="input-error"
            />
            <div id="input-error" class="error-msg" role="alert" aria-live="polite">
              <span aria-hidden="true" class="error-icon">⚠️</span> Please enter a task description.
            </div>
          </div>
          <button type="submit" id="add-btn" class="btn btn-primary" aria-label="Add new task">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add</span>
          </button>
        </div>
      </form>

      <!-- Filter Controls & Quick Stats -->
      <nav class="todo-filter-nav" aria-label="Filter tasks">
        <div class="filter-tabs" role="tablist">
          <button type="button" role="tab" class="filter-tab active" data-filter="all" id="tab-all" aria-selected="true">
            All
          </button>
          <button type="button" role="tab" class="filter-tab" data-filter="active" id="tab-active" aria-selected="false">
            Active
          </button>
          <button type="button" role="tab" class="filter-tab" data-filter="completed" id="tab-completed" aria-selected="false">
            Completed
          </button>
        </div>
      </nav>

      <!-- Task List Area -->
      <section class="todo-list-container" aria-label="Tasks list">
        <ul id="todo-list" class="todo-list" role="list">
          <!-- Dynamically populated via app.js -->
        </ul>

        <!-- Empty State Message -->
        <div id="empty-state" class="empty-state hidden" aria-live="polite">
          <div class="empty-icon-wrap" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <p class="empty-title">No tasks found</p>
          <p class="empty-subtitle">Your to-do list is sparkling clean!</p>
        </div>
      </section>

      <!-- Task Footer / Meta & Bulk Actions -->
      <footer class="todo-footer" id="todo-footer">
        <span id="items-left" class="items-left" aria-live="polite">0 items left</span>
        <button type="button" id="clear-completed-btn" class="btn btn-ghost hidden" aria-label="Clear all completed tasks">
          Clear Completed
        </button>
      </footer>
    </div>

    <!-- Quick Undo Notification / Toast -->
    <aside id="undo-toast" class="undo-toast hidden" role="status" aria-live="polite">
      <div class="toast-content">
        <span class="toast-message" id="toast-message">Task deleted</span>
        <div class="toast-actions">
          <button type="button" id="undo-btn" class="toast-undo-btn">Undo</button>
          <button type="button" id="toast-close-btn" class="toast-close-btn" aria-label="Dismiss notification">&times;</button>
        </div>
      </div>
      <div class="toast-progress" id="toast-progress" aria-hidden="true"></div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
